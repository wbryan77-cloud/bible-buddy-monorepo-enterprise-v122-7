
services:
  - type: web
    name: bible-buddy
    env: node
    plan: standard
    # DEPLOYMENT_RECOVERY — this service was deploying `main`, which does not
    # contain the verified Founder Alpha baseline (that work lives on
    # `sprint-2c-c3-explicit-scripture-handoff`). Render defaults an
    # unset `branch` to the repo's default branch, which is `main`; setting
    # it explicitly here points the service at the verified branch instead.
    branch: sprint-2c-c3-explicit-scripture-handoff
    # `npx prisma migrate deploy` is a guaranteed build failure: `prisma` is
    # not a package.json dependency and no prisma/migrations/ directory
    # exists. The live runtime uses local JSONL/JSON file persistence, not
    # Prisma. Removed so the build actually succeeds.
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUDDY_RUNTIME
        value: legacy
      - key: BUDDY_TEMPLATE_PROSE
        value: "0"
      - key: BUDDY_DISABLE_STUDY_FALLBACK
        value: "1"
      - key: BUDDY_DEBUG
        value: "0"
      - key: BUDDY_LIVE_TRACE
        value: "0"
      - key: OPENAI_API_KEY
        sync: false
      # Gates every /admin/api/bible-authority/* route (checkAdminAuth() in
      # routes/bibleAuthorityAdmin.js). Must be set to a real secret in the
      # Render dashboard before inviting Founder testers.
      - key: BIBLE_AUTHORITY_ADMIN_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        value: change-me
      - key: PHASE_AUTOSTART
        value: "1"
      - key: AI_DEPLOYMENT_AGENT
        value: enabled
      - key: TIMEZONE
        value: America/Chicago
      - key: PERSISTENCE
        value: MEMORY
      - key: POSTGRES_PRISMA
        value: enabled
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: SABBATH_QUIET
        value: "true"
      - key: SUNDAY_RENEWAL_TIME
        value: "08:00"
      - key: QUEUE_RATE_PER_MINUTE
        value: "60"
      - key: QUEUE_MAX_RETRIES
        value: "5"
