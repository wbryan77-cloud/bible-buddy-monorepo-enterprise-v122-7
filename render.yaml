
services:
  - type: web
    name: bible-buddy
    env: node
    plan: standard
    # PHASE_6F Part 15 — `npx prisma migrate deploy` was removed from this
    # build step. It is a guaranteed, reproducible build failure today:
    # `prisma` is not a package.json dependency, no `prisma/migrations/`
    # directory exists, and prisma/schema.prisma uses a datasource `url`
    # syntax that current Prisma CLI versions reject outright (verified
    # live: `Error: Prisma schema validation - (get-config wasm)` /
    # `P1012`). The live runtime does not use Prisma or any database today
    # (all persistence is local JSONL/JSON files under data/ — see
    # docs/alpha/phase6f-*/ArchitectureScaleReadiness.md) so this step was
    # pure dead weight that would have broken every deploy. Re-add a real
    # migration step only once a database is actually wired into the
    # runtime, with a valid schema and a committed prisma/migrations/
    # directory.
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUDDY_RUNTIME
        value: legacy
      - key: BUDDY_TEMPLATE_PROSE
        value: "0"
      - key: BUDDY_DISABLE_STUDY_FALLBACK
        value: "1"
      - key: BUDDY_DEBUG
        value: "0"
      - key: BUDDY_LIVE_TRACE
        value: "0"
      - key: OPENAI_API_KEY
        sync: false
      # FOUNDER_ALPHA_DEPLOYMENT_ACTIVATION — the actual Admin route gate is
      # routes/bibleAuthorityAdmin.js checkAdminAuth(), which reads
      # BIBLE_AUTHORITY_ADMIN_TOKEN (falling back to ALPHA_ADMIN_TOKEN /
      # BETA_REVIEW_TOKEN). ADMIN_PASSWORD below is legacy scaffolding with no
      # code reference anywhere in this repo — it does not protect anything.
      # Set BIBLE_AUTHORITY_ADMIN_TOKEN to a real secret in the Render
      # dashboard before inviting any Founder testers; leaving it unset
      # leaves every /admin/api/bible-authority/* route publicly readable.
      - key: BIBLE_AUTHORITY_ADMIN_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        value: change-me
      - key: PHASE_AUTOSTART
        value: "1"
      - key: AI_DEPLOYMENT_AGENT
        value: enabled
      - key: TIMEZONE
        value: America/Chicago
      - key: PERSISTENCE
        value: MEMORY
      - key: POSTGRES_PRISMA
        value: enabled
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: SABBATH_QUIET
        value: "true"
      - key: SUNDAY_RENEWAL_TIME
        value: "08:00"
      - key: QUEUE_RATE_PER_MINUTE
        value: "60"
      - key: QUEUE_MAX_RETRIES
        value: "5"
