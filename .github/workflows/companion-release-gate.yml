name: Companion Release Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  companion-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run companion release gate
        run: node scripts/sprint2FinalReleaseGate.js

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-release-gate-report
          path: docs/release-gate/latest-gate-results.json
