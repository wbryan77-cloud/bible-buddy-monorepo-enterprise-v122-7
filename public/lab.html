<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Buddy Lab</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
      color: #333;
      text-align: center;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #ddd;
    }

    .tab {
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      font-weight: 600;
      color: #555;
    }

    .tab.active {
      border-bottom: 3px solid #4a6cf7;
      color: #4a6cf7;
    }

    .chat-box {
      height: 320px;
      overflow-y: auto;
      background: #fafafa;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-bottom: 20px;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 10px;
      line-height: 1.4;
      white-space: pre-line;
    }

    .user {
      background: #d5e3ff;
      margin-left: auto;
    }

    .assistant {
      background: #eee;
      margin-right: auto;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #4a6cf7;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #3a56ca;
    }

    .hidden {
      display: none;
    }

    .error-box {
      background: #ffe5e5;
      color: #a40000;
      padding: 10px 15px;
      border: 1px solid #ffb3b3;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .dropzone {
      width: 100%;
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 25px;
      background: #fafafa;
      text-align: center;
      color: #555;
      margin-bottom: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Bible Buddy Lab</h1>
    <p style="text-align:center;">Early-access testing. Bible Buddy learns as you and others use it.</p>

    <!-- Tabs -->
    <div class="tabs">
      <div id="tab-chat" class="tab active">Chat</div>
      <div id="tab-picture" class="tab">Picture ➜ Plan</div>
    </div>

    <!-- CHAT MODE -->
    <div id="chat-mode">
      <div id="chat-box" class="chat-box"></div>

      <div class="input-row">
        <input id="chat-input" type="text" placeholder="Ask Bible Buddy anything…" />
        <button onclick="sendChat()">Send</button>
      </div>
    </div>

    <!-- PICTURE MODE -->
    <div id="picture-mode" class="hidden">
      <div id="error-box" class="error-box hidden"></div>

      <div id="dropzone" class="dropzone" onclick="selectImage()">
        Drop an image here or click to choose a file
      </div>

      <input id="file-input" type="file" accept="image/*" class="hidden" />

      <div class="input-row">
        <input id="picture-desc" type="text" placeholder="Describe the notes or whiteboard content…" />
        <button onclick="sendPicture()">Ask Bible Buddy</button>
      </div>
    </div>
  </div>

  <script>
    // TAB SWITCHING
    const tabChat = document.getElementById("tab-chat");
    const tabPicture = document.getElementById("tab-picture");
    const chatMode = document.getElementById("chat-mode");
    const pictureMode = document.getElementById("picture-mode");

    tabChat.onclick = () => {
      tabChat.classList.add("active");
      tabPicture.classList.remove("active");
      chatMode.classList.remove("hidden");
      pictureMode.classList.add("hidden");
    };

    tabPicture.onclick = () => {
      tabPicture.classList.add("active");
      tabChat.classList.remove("active");
      pictureMode.classList.remove("hidden");
      chatMode.classList.add("hidden");
    };

    // CHAT
    const chatBox = document.getElementById("chat-box");

    function addBubble(text, sender) {
      const div = document.createElement("div");
      div.classList.add("bubble", sender);
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendChat() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;

      addBubble(text, "user");
      input.value = "";

      const response = await fetch("/api/ai/tester-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });

      const data = await response.json();

      if (data.error) {
        addBubble("❌ Error: " + data.error, "assistant");
      } else {
        addBubble(data.reply, "assistant");
      }
    }

    // PICTURE MODE
    function selectImage() {
      document.getElementById("file-input").click();
    }

    async function sendPicture() {
      const file = document.getElementById("file-input").files[0];
      const desc = document.getElementById("picture-desc").value.trim();
      const errorBox = document.getElementById("error-box");

      if (!file) {
        errorBox.textContent = "Please upload an image first.";
        errorBox.classList.remove("hidden");
        return;
      }

      errorBox.classList.add("hidden");

      const form = new FormData();
      form.append("image", file);
      form.append("description", desc);

      const res = await fetch("/api/ai/tester-image-plan", {
        method: "POST",
        body: form,
      });

      const data = await res.json();

      if (data.error) {
        errorBox.textContent = "❌ " + data.error;
        errorBox.classList.remove("hidden");
      } else {
        addBubble("📸 Picture → Plan:\n" + data.plan, "assistant");
      }
    }
  </script>
</body>
</html>
