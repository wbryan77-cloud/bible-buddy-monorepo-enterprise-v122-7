<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bible Buddy Lab</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 820px;
      margin: 40px auto;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 34px;
      font-weight: 700;
      text-align: center;
      color: #333;
    }

    .tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 25px;
      padding-bottom: 10px;
      border-bottom: 2px solid #ddd;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #eee;
      font-size: 16px;
    }

    .tab-btn.active {
      background: #4a6cf7;
      color: white;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .chat-box {
      width: 100%;
      height: 180px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      resize: vertical;
    }

    #sendBtn {
      margin-top: 15px;
      padding: 12px 22px;
      background: #4a6cf7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #3b57c9;
    }

    .response-box {
      margin-top: 20px;
      padding: 18px;
      background: #f0f3ff;
      border-radius: 10px;
      white-space: pre-wrap;
      font-size: 16px;
      border: 1px solid #d2d9ff;
    }

    /* Image upload */
    .upload-box {
      border: 2px dashed #bbb;
      padding: 35px;
      text-align: center;
      border-radius: 12px;
      color: #777;
      cursor: pointer;
      margin-bottom: 20px;
      background: #fafafa;
    }

    #voiceBtn {
      margin-left: 10px;
      padding: 10px 14px;
      background: #000;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📘 Bible Buddy Lab</h1>

    <p style="text-align:center; color:#555; font-size:17px;">
      Early tester experience — guided by AI. Upload notes, chat, or turn a picture into a structured Bible plan.
    </p>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('chat')">💬 Chat</button>
      <button class="tab-btn" onclick="showTab('image')">🖼 Picture ➜ Plan</button>
    </div>

    <!-- CHAT SECTION -->
    <div id="chat" class="section active">
      <textarea id="chatInput" class="chat-box" placeholder="Ask Bible Buddy anything…"></textarea>

      <div style="margin-top:10px;">
        <button id="sendBtn" onclick="sendChat()">Send</button>
        <button id="voiceBtn" onclick="startVoice()">🎤</button>
      </div>

      <div id="chatResponse" class="response-box" style="display:none;"></div>
    </div>

    <!-- IMAGE TO PLAN SECTION -->
    <div id="image" class="section">
      <label class="upload-box" onclick="document.getElementById('fileInput').click()">
        Drop or click to upload an image
      </label>
      <input type="file" id="fileInput" accept="image/*" style="display:none" />

      <textarea id="imageDescription" class="chat-box" placeholder="Describe what your notes or whiteboard contain…"></textarea>

      <button id="sendBtn" onclick="sendImagePlan()">Ask Bible Buddy</button>

      <div id="imageResponse" class="response-box" style="display:none;"></div>
    </div>
  </div>

  <script>
    function showTab(tab) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }

    async function sendChat() {
      const msg = document.getElementById("chatInput").value.trim();
      if (!msg) return;

      const resBox = document.getElementById("chatResponse");
      resBox.style.display = "block";
      resBox.textContent = "Thinking…";

      const res = await fetch("/api/ai/tester-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });

      const data = await res.json();
      resBox.textContent = data.reply || JSON.stringify(data);
    }

    async function sendImagePlan() {
      const desc = document.getElementById("imageDescription").value.trim();
      const file = document.getElementById("fileInput").files[0];

      if (!desc && !file) {
        alert("Please upload an image or enter a description.");
        return;
      }

      const resBox = document.getElementById("imageResponse");
      resBox.style.display = "block";
      resBox.textContent = "Analyzing image…";

      const fd = new FormData();
      if (file) fd.append("image", file);
      fd.append("description", desc);

      const res = await fetch("/api/ai/tester-image", {
        method: "POST",
        body: fd
      });

      const data = await res.json();
      resBox.textContent = data.plan || JSON.stringify(data);
    }

    function startVoice() {
      const rec = new webkitSpeechRecognition();
      rec.lang = "en-US";
      rec.start();

      rec.onresult = (event) => {
        document.getElementById("chatInput").value =
          event.results[0][0].transcript;
      };
    }
  </script>
</body>
</html>
