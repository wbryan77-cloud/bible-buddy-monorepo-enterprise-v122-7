<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bible Buddy – Tester Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #f7f6f4;
      color: #111827;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 16px 16px 80px;
      display: flex;
      flex-direction: column;
    }

    /* Header */

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e5edff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .titles h1 {
      margin: 0;
      font-size: 1.6rem;
    }

    .titles p {
      margin: 4px 0 0;
      font-size: 0.9rem;
      color: #4b5563;
    }

    /* Chat log */

    .log {
      flex: 1;
      margin-top: 8px;
      padding: 8px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.04);
      overflow-y: auto;
    }

    .msg {
      display: flex;
      margin: 6px 0;
    }

    .msg.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .msg.user .bubble {
      background: #dbeafe;
      color: #111827;
      border-bottom-right-radius: 4px;
    }

    .msg.bot .bubble {
      background: #f3f4f6;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .status {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #6b7280;
      text-align: right;
    }

    /* Quick action buttons */

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .quick-actions button {
      border-radius: 999px;
      border: 1px solid #d1d5db;
      padding: 6px 10px;
      font-size: 0.8rem;
      background: #f9fafb;
      cursor: pointer;
    }

    .quick-actions button:hover {
      background: #eef2ff;
    }

    /* Input bar */

    .input-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px 12px 16px;
      background: linear-gradient(to top, #f7f6f4 60%, rgba(247,246,244,0.7));
    }

    .input-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }

    #text {
      flex: 1;
      padding: 9px 10px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      font-size: 0.95rem;
    }

    #send {
      border-radius: 999px;
      border: none;
      padding: 9px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      background: #4b6bfb;
      color: #ffffff;
      cursor: pointer;
    }

    #send:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="avatar">📖</div>
      <div class="titles">
        <h1>Bible Buddy – Tester Chat</h1>
        <p>I’m your AI testing companion for Bible Buddy.</p>
      </div>
    </header>

    <div id="log" class="log"></div>

    <div class="quick-actions">
      <button type="button" data-quick="Let’s walk through a short devotional flow together.">
        Test devotional flow
      </button>
      <button type="button" data-quick="Help me practice follow-up questions around a Bible verse.">
        Test follow-up questions
      </button>
      <button type="button" data-quick="Help me explore how you remember context across a conversation.">
        Test memory &amp; context
      </button>
      <button type="button" data-quick="Help me create a simple test plan for my first users.">
        Create a test plan
      </button>
    </div>

    <div class="status" id="status">Ready when you are.</div>
  </div>

  <div class="input-bar">
    <form id="chat-form" class="input-inner" autocomplete="off">
      <input
        id="text"
        type="text"
        placeholder="Type a message to Bible Buddy…"
        autocomplete="off"
      />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const logEl = document.getElementById('log');
      const formEl = document.getElementById('chat-form');
      const textEl = document.getElementById('text');
      const sendBtn = document.getElementById('send');
      const statusEl = document.getElementById('status');
      const quickButtons = document.querySelectorAll('[data-quick]');

      function scrollToBottom() {
        logEl.scrollTop = logEl.scrollHeight;
      }

      function addMessage(role, text) {
        const row = document.createElement('div');
        row.className = 'msg ' + (role === 'user' ? 'user' : 'bot');

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = String(text || '').replace(/\n/g, '<br>');

        row.appendChild(bubble);
        logEl.appendChild(row);
        scrollToBottom();
      }

      async function sendToBuddy(rawText) {
        const text = String(rawText || '').trim();
        if (!text) return;

        // show user message immediately
        addMessage('user', text);
        textEl.value = '';
        textEl.focus();

        sendBtn.disabled = true;
        statusEl.textContent = 'Bible Buddy is thinking…';

        try {
          const res = await fetch('/api/ai/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: text })
          });

          if (!res.ok) {
            throw new Error('Server returned status ' + res.status);
          }

          const data = await res.json();
          if (!data.ok) {
            throw new Error(data.error || 'Unknown error');
          }

          addMessage('assistant', data.reply || '(no reply)');
          statusEl.textContent = 'Ready.';
        } catch (err) {
          console.error('AI chat error:', err);
          addMessage(
            'assistant',
            "Hmm, something went wrong talking to the server.\n\n" +
            "Details: " + (err.message || 'Unknown error.')
          );
          statusEl.textContent = 'Error: ' + (err.message || 'Unknown');
        } finally {
          sendBtn.disabled = false;
        }
      }

      function handleSubmit(e) {
        e.preventDefault();
        sendToBuddy(textEl.value);
      }

      formEl.addEventListener('submit', handleSubmit);

      quickButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          const msg = btn.getAttribute('data-quick') || '';
          sendToBuddy(msg);
        });
      });

      // Single, non-redundant intro from Bible Buddy
      addMessage(
        'assistant',
        "👋 Hey there, I’m Bible Buddy. I’ll walk with you as we test this app.\n\n" +
        "You can type anything, or tap one of the buttons above to jump into a specific kind of test."
      );
    });
  </script>
</body>
</html>
