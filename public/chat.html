<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📖 Bible Buddy – Tester Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #f7f5ff;
      color: #222;
    }

    .page {
      max-width: 700px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 1.6rem;
      margin: 4px 0 0;
    }

    header .icon {
      font-size: 2rem;
    }

    header .subtitle {
      font-size: 0.95rem;
      color: #555;
      margin-top: 8px;
    }

    #log {
      flex: 1;
      background: #ffffff;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      overflow-y: auto;
      max-height: calc(100vh - 200px);
    }

    .msg-row {
      display: flex;
      margin: 6px 0;
    }

    .msg-row.me {
      justify-content: flex-end;
    }

    .bubble {
      padding: 8px 11px;
      border-radius: 16px;
      max-width: 80%;
      font-size: 0.92rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .bubble.me {
      background: #0044cc;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble.bot {
      background: #eef0ff;
      color: #222;
      border-bottom-left-radius: 4px;
    }

    .status {
      font-size: 0.8rem;
      color: #777;
      margin: 6px 4px 10px;
      text-align: right;
    }

    .input-bar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    #text {
      flex: 1;
      border-radius: 999px;
      border: 1px solid #ccc;
      padding: 8px 14px;
      font-size: 0.95rem;
      outline: none;
    }

    #text:focus {
      border-color: #446bff;
      box-shadow: 0 0 0 2px rgba(68, 107, 255, 0.15);
    }

    #send {
      border-radius: 999px;
      border: none;
      padding: 0 18px;
      font-size: 0.95rem;
      background: #446bff;
      color: white;
      cursor: pointer;
    }

    #send:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="icon">📖</div>
      <h1>Bible Buddy – Tester Chat</h1>
      <div class="subtitle">
        I’m your AI testing companion. Let’s gently walk through Bible Buddy together.
      </div>
    </header>

    <div id="log"></div>
    <div id="status" class="status">Ready.</div>

    <form id="chat-form" class="input-bar" autocomplete="off">
      <input
        id="text"
        type="text"
        placeholder="Type a message to Bible Buddy…"
      />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const formEl = document.getElementById('chat-form');
    const textEl = document.getElementById('text');
    const sendBtn = document.getElementById('send');

    function scrollToBottom() {
      logEl.scrollTop = logEl.scrollHeight;
    }

    function addMessage(role, text) {
      const row = document.createElement('div');
      row.className = 'msg-row ' + (role === 'user' ? 'me' : 'bot');

      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (role === 'user' ? 'me' : 'bot');
      bubble.textContent = text;

      row.appendChild(bubble);
      logEl.appendChild(row);
      scrollToBottom();
    }

    async function sendToBuddy(rawText) {
      const text = String(rawText || '').trim();
      if (!text) return;

      // show user message immediately
      addMessage('user', text);
      textEl.value = '';
      textEl.focus();

      // lock button & show status
      sendBtn.disabled = true;
      statusEl.textContent = 'Bible Buddy is thinking…';

      try {
        const res = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: text })
        });

        if (!res.ok) {
          throw new Error('Server returned ' + res.status);
        }

        const data = await res.json();
        if (!data.ok) {
          throw new Error(data.error || 'Unknown error from API');
        }

        addMessage('assistant', data.reply || '(no reply)');
        statusEl.textContent = 'Ready.';
      } catch (err) {
        console.error(err);
        addMessage(
          'assistant',
          'Hmm, something went wrong talking to the server. Please try again in a moment or refresh the page.'
        );
        statusEl.textContent = 'Error: ' + (err.message || 'Unknown');
      } finally {
        sendBtn.disabled = false;
      }
    }

    function handleSubmit(e) {
      if (e) e.preventDefault();
      sendToBuddy(textEl.value);
    }

    // hook form submit
    formEl.addEventListener('submit', handleSubmit);

    // initial intro message (only once)
    addMessage(
      'assistant',
      '👋 Hey there, I’m Bible Buddy. I’ll help guide testing and gently coach you as we try things out.\n\n' +
        'Today, what would you most like to test?\n' +
        '• Talking through a verse or topic\n' +
        '• Trying a sample devotional flow\n' +
        '• Seeing how I remember context within a conversation\n' +
        '• Or something else that’s on your heart?'
    );
  </script>
</body>
</html>
